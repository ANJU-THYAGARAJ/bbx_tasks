<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Details</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;      /* Moves card to top */
    padding-top:80px;            /* Space from top */
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    overflow-x:hidden;
    position:relative;
}

/* Background Glow */
body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#f59e0b;
    filter:blur(180px);
    opacity:.18;
    top:-120px;
    left:-120px;
}

body::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    background:#3b82f6;
    filter:blur(180px);
    opacity:.18;
    bottom:-120px;
    right:-120px;
}

.container{
    position:relative;
    width:90%;
    max-width:720px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:45px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    transition:.4s;
    z-index:1;
}

.container:hover{
    transform:translateY(-8px);
    box-shadow:0 30px 60px rgba(0,0,0,.5);
}

.icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#f59e0b,#facc15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    color:#fff;
    margin-bottom:20px;
}

h1{
    color:#ffffff;
    font-size:34px;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    font-size:16px;
    margin-bottom:35px;
}

#output{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:15px;
    padding:25px;
    text-align:left;
    color:#f8fafc;
    font-size:18px;
    line-height:2;
    transition:.4s;
    min-height:180px;
}

#output:hover{
    border-color:#fbbf24;
    box-shadow:0 0 25px rgba(251,191,36,.25);
}

.footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:14px;
    letter-spacing:1px;
}

/* Responsive */
@media(max-width:768px){

    body{
        padding-top:40px;
    }

    .container{
        padding:30px;
    }

    h1{
        font-size:28px;
    }

    #output{
        font-size:16px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="icon">🎓</div>

    <h1>Student Details</h1>


    <div id="output">
        <!-- JavaScript Output Will Appear Here -->
    </div>

    <div class="footer">
        JavaScript Practice • Variables • Operators
    </div>

</div>

<script src="asset/js/task6.js"></script>

</body>
</html>
