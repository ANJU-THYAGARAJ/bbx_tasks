<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Cards</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f4f6;
}

.cards{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    flex-wrap:wrap;
    padding:60px;
}

/* Heading */

.title{
    text-align:center;
    margin-top:40px;
    font-size:34px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:40px;
}

/* HTML + CSS Card */

.html-card{

    width:320px;
    height:470px;

    background:#fff;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:40px;
}

.profile{

    width:110px;
    height:110px;

    border-radius:50%;
    background:#2563eb;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:35px;
}

.profile i{

    color:#fff;
    font-size:55px;
}

.html-card h2{

    font-size:28px;
    font-weight:bold;

    color:#111827;

    margin-bottom:12px;
}

.html-card p{

    font-size:18px;

    color:#6b7280;

    margin-bottom:45px;
}

.html-card button{
    width:130px;
    height:45px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.html-card button:hover{
    background:#1d4ed8;
}

.card-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
    color:#2563eb;
}

</style>

</head>

<body>

<h1 class="title">Profile Cards</h1>


<div class="cards">


<div>

<div class="card-title">HTML + CSS</div>

<div class="html-card">

<div class="profile">
<i class="fa-solid fa-user"></i>
</div>

<h2>John Doe</h2>

<p>Front-End Developer</p>

<button>View Profile</button>

</div>

</div>

<div>

    <div class="card-title text-center">Bootstrap</div>

    <div class="card border-0 shadow rounded-4 d-flex flex-column justify-content-center align-items-center text-center"
        style="width:320px; height:470px; padding:40px;">

        <div class="rounded-circle bg-primary d-flex justify-content-center align-items-center mb-4"
            style="width:110px; height:110px;">

            <i class="fa-solid fa-user text-white" style="font-size:55px;"></i>

        </div>

        <h2 class="fw-bold mb-2" style="font-size:28px;">
            John Doe
        </h2>

        <p class="text-secondary mb-5" style="font-size:18px;">
            Front-End Developer
        </p>

        <button class="btn btn-primary"
    style="width:130px;
           height:45px;
           font-size:18px;
           font-weight:600;
           border-radius:8px;">
    View Profile
</button>
            

    </div>

</div>

<div>

    <div class="card-title text-center">Tailwind CSS</div>

    <div class="bg-white rounded-[20px] shadow-lg
                w-[320px] h-[470px]
                flex flex-col justify-center items-center
                text-center p-[40px]">

        <div class="w-[110px] h-[110px]
                    rounded-full bg-blue-600
                    flex justify-center items-center
                    mb-[35px]">

            <i class="fa-solid fa-user text-white text-[55px]"></i>

        </div>

        <h2 class="text-[28px] font-bold text-gray-900 mb-3">
            John Doe
        </h2>

        <p class="text-[18px] text-gray-500 mb-[45px]">
            Front-End Developer
        </p>

        <button
    class="w-[130px] h-[45px]
           bg-blue-600 hover:bg-blue-700
           text-white text-[18px]
           font-semibold rounded-[8px]">
    View Profile
</button>

    </div>

</div>
