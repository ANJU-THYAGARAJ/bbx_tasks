<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>

    <link rel="stylesheet" href="asset/css/facebook.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <aside class="left">

        <img src="asset/img/logo.jpeg" class="logo" alt="Facebook">

        <div class="left-content">

            <div class="text">

                <h1>
                    Explore <br>
                    the <br>
                    things <br>
                    <span>you love.</span>
                </h1>

            </div>

            <div class="hero">

                <img src="asset/img/face.webp" alt="Hero Image">

            </div>

        </div>

    </aside>


    <!-- RIGHT SIDE -->

    <aside class="right">

        <div class="login-box">

            <h2>Log in to Facebook</h2>

            <form>

                <input
                type="text"
                placeholder="Email address or mobile number">

                <input
                type="password"
                placeholder="Password">

                <button class="login-btn">
                    Log in
                </button>

                <a href="#">Forgotten password?</a>

                <button class="create-btn">
                    Create new account
                </button>

            </form>

            <div class="meta">

                <img src="asset/img/metalogo.png" alt="Meta">

            </div>

        </div>

    </aside>

</div>

</body>
</html>
